[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goodai-enterprise"
version = "0.1.0"
description = "Enterprise AI Implementation Framework by Good AI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Good AI", email = "engineering@goodai.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["ai", "enterprise", "manufacturing", "anomaly-detection", "oee"]

dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "opencv-python-headless>=4.8.0",
    "pytesseract>=0.3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.25.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
]
all = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/GoodAI-Global/enterprise-ai-framework"
Documentation = "https://github.com/GoodAI-Global/enterprise-ai-framework#readme"
Repository = "https://github.com/GoodAI-Global/enterprise-ai-framework"
Changelog = "https://github.com/GoodAI-Global/enterprise-ai-framework/blob/main/CHANGELOG.md"
Issues = "https://github.com/GoodAI-Global/enterprise-ai-framework/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = [
    "E501",  # line too long (handled by formatter)
    "E712",  # comparison to True/False (acceptable in tests)
    "E721",  # type comparison (acceptable in config parsing)
    "B007",  # unused loop control variable (use _ prefix if needed)
    "B008",  # function call in default argument (FastAPI pattern)
    "B904",  # raise from in except (common HTTP pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E402", "F401", "F841"]  # assert, late imports, unused allowed in tests

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
